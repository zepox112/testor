<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAA Gender & Counseling Support System</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --primary: #00d2ff;
            --accent: #ff4d4d;
            --success: #38ef7d;
            --bg: #061a3d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #061a3d 0%, #1e3c72 50%, #061a3d 100%);
            font-family: 'Poppins', sans-serif;
            color: white; height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        #lockOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #061a3d, #1e3c72);
            z-index: 10000; display: flex; justify-content: center; align-items: center; backdrop-filter: blur(25px);
        }

        .lock-box {
            background: var(--glass); border: 1px solid rgba(255,255,255,0.2);
            padding: 30px; border-radius: 30px; text-align: center; width: 95%; max-width: 450px;
        }

        /* --- UI YA CAMERA --- */
        #cameraContainer {
            width: 250px; height: 250px; border-radius: 50%; overflow: hidden;
            border: 4px solid var(--primary); margin: 0 auto 20px; position: relative; display: none;
            box-shadow: 0 0 30px var(--primary);
        }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

        .scan-line {
            position: absolute; width: 100%; height: 4px; background: var(--primary);
            box-shadow: 0 0 15px var(--primary); top: 0; animation: scan 2s infinite linear;
        }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }

        #emotionResult { font-size: 100px; display: none; margin-bottom: 20px; }

        .btn { background: linear-gradient(90deg, #9d50bb, #00d2ff); border: none; padding: 15px; width: 100%; border-radius: 15px; color: white; font-weight: 600; cursor: pointer; margin-top: 15px; font-family: 'Orbitron'; }
        
        .id-badge { background: var(--primary); color: #061a3d; padding: 10px 20px; border-radius: 10px; font-weight: bold; margin: 20px 0; display: inline-block; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="lockOverlay">
        <div class="lock-box" id="authBox">
            <h2 id="statusTitle" style="font-family: Orbitron; color: var(--primary); margin-bottom: 10px;">ULINZI WA SURA</h2>
            
            <div id="cameraContainer">
                <video id="webcam" autoplay playsinline></video>
                <div class="scan-line"></div>
            </div>
            <div id="emotionResult">😊</div>

            <div id="mainButtons">
                <button class="btn" onclick="startSuraAuth()">HAKIKI SURA SASA 🔓</button>
                <button class="btn" style="background:none; border:1px solid var(--primary); margin-top:20px;" onclick="showReg()">MGENI MPYA (SAJILI SURA)</button>
            </div>

            <div id="regBox" class="hidden">
                <p style="font-size: 11px;">Kodi yako ya siri:</p>
                <div class="id-badge" id="newIDDisplay">...</div>
                <button class="btn" onclick="captureFaceData()">PIGA PICHA & SAJILI SURA</button>
            </div>
        </div>
    </div>

    <div id="mainApp" class="hidden" style="text-align: center;">
        <h1>IAA PORTAL IPO WAZI</h1>
        <p>Karibu, utambulisho wako umethibitishwa.</p>
    </div>

    <script>
        let registeredFace = localStorage.getItem('user_face_data');
        const video = document.getElementById('webcam');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                document.getElementById('cameraContainer').style.display = 'block';
            } catch (err) { alert("Ruhusu Kamera kuendelea!"); }
        }

        // 1. Sajili Sura
        function showReg() {
            const tempID = 'ANON-' + Math.random().toString(36).substring(2,6).toUpperCase();
            document.getElementById('newIDDisplay').innerText = tempID;
            document.getElementById('mainButtons').classList.add('hidden');
            document.getElementById('regBox').classList.remove('hidden');
            initCamera();
        }

        function captureFaceData() {
            // Katika mfumo wa kweli, hapa tunapiga picha na kuigeuza kuwa "Data Hash"
            // Kwa ajili ya asilimia 100 sasa:
            localStorage.setItem('user_face_data', 'registered'); 
            registeredFace = 'registered';
            
            document.getElementById('statusTitle').innerText = "USAJILI TAYARI!";
            document.getElementById('emotionResult').innerText = "😊";
            document.getElementById('emotionResult').style.display = "block";
            document.getElementById('cameraContainer').style.display = "none";
            
            setTimeout(() => location.reload(), 2000);
        }

        // 2. Hakiki Sura
        async function startSuraAuth() {
            if (!registeredFace) return alert("Hujasajili sura bado!");
            await initCamera();
            document.getElementById('statusTitle').innerText = "INATAMBUA SURA...";

            setTimeout(() => {
                // SIMULATION YA UHAKIKI:
                // Ikiwa sura inalingana (Success):
                const isMatch = true; 

                if(isMatch) {
                    document.getElementById('statusTitle').innerText = "IMETHIBITISHWA!";
                    document.getElementById('statusTitle').style.color = "var(--success)";
                    document.getElementById('emotionResult').innerText = "😊";
                    document.getElementById('emotionResult').style.display = "block";
                    document.getElementById('cameraContainer').style.display = "none";
                    
                    setTimeout(() => {
                        document.getElementById('lockOverlay').style.display = 'none';
                        document.getElementById('mainApp').classList.remove('hidden');
                    }, 2000);
                } else {
                    // Ikiwa mtu mwingine (Fail):
                    document.getElementById('statusTitle').innerText = "SURA SIO SAHIHI!";
                    document.getElementById('statusTitle').style.color = "var(--accent)";
                    document.getElementById('emotionResult').innerText = "😔";
                    document.getElementById('emotionResult').style.display = "block";
                    document.getElementById('cameraContainer').style.display = "none";
                }
            }, 5000);
        }
    </script>
</body>
</html>
