<!DOCTYPE html>
<html lang="sw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAA Gender & Counseling Support System</title>

    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="shortcut icon" href="logo.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --primary: #00d2ff;
            --secondary: #9d50bb;
            --accent: #ff4d4d;
            --success: #38ef7d;
            --bg: #061a3d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #061a3d 0%, #1e3c72 50%, #061a3d 100%);
            font-family: 'Poppins', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow: hidden;
        }

        #lockOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #061a3d, #1e3c72);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(25px);
            transition: 0.5s;
        }

        .lock-box {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            width: 95%;
            max-width: 450px;
            position: relative;
            z-index: 2;
        }

        .header-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: white;
            margin-bottom: 15px;
            border: 2px solid var(--primary);
            object-fit: cover;
        }

        /* --- FULL SCREEN SCANNER UI --- */
        #biometricScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 26, 61, 0.98);
            z-index: 20000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .scan-circle {
            width: 150px;
            height: 150px;
            border: 4px solid var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            margin-bottom: 20px;
        }

        .scan-emoji {
            font-size: 60px;
            display: none;
        }

        .scanning-line {
            position: absolute;
            width: 100%;
            height: 4px;
            background: var(--primary);
            top: 0;
            box-shadow: 0 0 20px var(--primary);
            animation: scanMove 2s infinite ease-in-out;
        }

        @keyframes scanMove {

            0%,
            100% {
                top: 10%;
            }

            50% {
                top: 90%;
            }
        }

        /* Particles Background kwa ajili ya Fingerprints wingi */
        #particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            opacity: 0.2;
        }

        .finger-particle {
            position: absolute;
            font-size: 20px;
            color: var(--primary);
            animation: fall 3s infinite linear;
        }

        @keyframes fall {
            from {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }

            to {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        .id-badge {
            background: var(--primary);
            color: #061a3d;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-family: 'Orbitron';
            margin: 20px 0;
            display: inline-block;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--glass);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            padding: 20px;
            display: none;
        }

        .btn {
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 15px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>
    <div id="lockOverlay">
        <div class="lock-box">
            <img src="logo.jpg" alt="Logo" class="header-logo">
            <h2 style="font-family: Orbitron; color: var(--primary); font-size: 18px;">IAA SECURITY ACCESS</h2>
            <p style="font-size: 10px; margin-bottom: 20px; opacity: 0.8;">Bofya hapa chini kuhakiki utambulisho</p>

            <div id="mainAuthUI">
                <button class="btn" onclick="openBiometricScanner()">HAKIKI KWA BIOMETRICS 🔓</button>
                <p style="font-size: 10px; margin: 15px 0;">AU TUMIA KODI</p>
                <input type="text" id="passcodeInput" placeholder="ANON-XXXX" style="text-transform: uppercase;">
                <button class="btn" style="background: rgba(255,255,255,0.1);" onclick="verifyWithCode()">INGIA KWA
                    KODI</button>
                <button class="btn" style="background:none; border: 1px solid var(--primary); margin-top: 20px;"
                    onclick="startNewUser()">MIMI NI MGENI MPYA</button>
            </div>

            <div id="newUserUI" class="hidden">
                <p style="font-size: 12px;">Kodi yako ya siri ni:</p>
                <div class="id-badge" id="newIDDisplay">...</div>
                <button class="btn" onclick="saveAndRegister()">SAJILI BIOMETRIC & INGIA</button>
            </div>
        </div>
    </div>

    <div id="biometricScreen">
        <div id="particles"></div>
        <div class="scan-circle" id="scannerCircle">
            <div class="scanning-line" id="line"></div>
            <div class="scan-emoji" id="emojiStatus">😊</div>
            <svg id="fingerMain" style="width:80px; fill:var(--primary);" viewBox="0 0 24 24">
                <path
                    d="M12 1c-4.97 0-9 4.03-9 9 0 .41.34.75.75.75s.75-.34.75-.75c0-4.14 3.36-7.5 7.5-7.5s7.5 3.36 7.5 7.5c0 .41.34.75.75.75s.75-.34.75-.75c0-4.97-4.03-9-9-9zM12 5c-2.76 0-5 2.24-5 5 0 .41.34.75.75.75s.75-.34.75-.75c0-1.93 1.57-3.5 3.5-3.5s3.5 1.57 3.5 3.5c0 .41.34.75.75.75s.75-.34.75-.75c0-2.76-2.24-5-5-5z" />
            </svg>
        </div>
        <h1 id="scanTitle" style="font-family: Orbitron; font-size: 20px; color: var(--primary);">INAHAKIKI...</h1>
        <p id="scanMsg" style="margin-top:10px;">Weka kidole chako au uso kwenye sensa</p>
    </div>

    <div class="container" id="mainApp">
        <div class="header">
            <img src="logo.jpg" alt="Logo" style="width: 50px; height: 50px; border-radius: 50%; background: white;">
            <h1 style="font-size: 16px; margin-top: 10px;">IAA GENDER SUPPORT</h1>
            <button class="btn" onclick="location.reload()"
                style="width: auto; padding: 5px 15px; font-size: 10px;">LOGOUT</button>
        </div>
        <div style="text-align: center; margin-top: 50px; opacity: 0.5;">
            <p>Portal Imefunguliwa Kikamilifu.</p>
            <p>Karibu kwenye mfumo wa siri.</p>
        </div>
    </div>

    <script>
        let anonId = localStorage.getItem('iaa_id');
        let tempID = "";

        // Tunga fingerprints nyingi (Particles)
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                let p = document.createElement('div');
                p.className = 'finger-particle';
                p.innerHTML = '👣';
                p.style.left = Math.random() * 100 + 'vw';
                p.style.animationDelay = Math.random() * 3 + 's';
                container.appendChild(p);
            }
        }

        async function openBiometricScanner() {
            if (!anonId) return alert("Hujasajiliwa bado!");

            document.getElementById('biometricScreen').style.display = 'flex';
            createParticles();

            // WebAuthn Trigger kwa ulinzi wa ndani wa kifaa
            try {
                const challenge = crypto.getRandomValues(new Uint8Array(32));
                const options = {
                    publicKey: { challenge, timeout: 60000, userVerification: "required" }
                };

                // Hapa ndipo Windows Hello/Android itawaka
                const auth = await navigator.credentials.get(options);

                if (auth) {
                    showSuccess("IMETHIBITISHWA! 😊");
                }
            } catch (e) {
                showError("SURA / KIDOLE SIO SAHIHI 😔");
            }
        }

        function showSuccess(msg) {
            const title = document.getElementById('scanTitle');
            const emoji = document.getElementById('emojiStatus');
            const finger = document.getElementById('fingerMain');
            const line = document.getElementById('line');

            title.innerText = msg;
            title.style.color = "var(--success)";
            emoji.innerText = "😊";
            emoji.style.display = "block";
            finger.style.display = "none";
            line.style.display = "none";

            setTimeout(() => {
                document.getElementById('biometricScreen').style.display = 'none';
                document.getElementById('lockOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
            }, 1500);
        }

        function showError(msg) {
            const title = document.getElementById('scanTitle');
            const emoji = document.getElementById('emojiStatus');
            const finger = document.getElementById('fingerMain');

            title.innerText = msg;
            title.style.color = "var(--accent)";
            emoji.innerText = "😔";
            emoji.style.display = "block";
            finger.style.display = "none";

            setTimeout(() => {
                document.getElementById('biometricScreen').style.display = 'none';
                emoji.style.display = "none";
                finger.style.display = "block";
                title.innerText = "INAHAKIKI...";
                title.style.color = "var(--primary)";
            }, 2500);
        }

        // New User & Code Verify
        function startNewUser() {
            tempID = 'ANON-' + Math.random().toString(36).substring(2, 6).toUpperCase();
            document.getElementById('mainAuthUI').classList.add('hidden');
            document.getElementById('newUserUI').classList.remove('hidden');
            document.getElementById('newIDDisplay').innerText = tempID;
        }

        async function saveAndRegister() {
            // Sajili Biometric mara ya kwanza
            try {
                const challenge = crypto.getRandomValues(new Uint8Array(32));
                const options = {
                    publicKey: {
                        challenge,
                        rp: { name: "IAA", id: window.location.hostname },
                        user: { id: crypto.getRandomValues(new Uint8Array(16)), name: tempID, displayName: tempID },
                        pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                        authenticatorSelection: { authenticatorAttachment: "platform" }
                    }
                };
                await navigator.credentials.create(options);
                localStorage.setItem('iaa_id', tempID);
                anonId = tempID;
                showSuccess("USAJILI TAYARI! 😊");
            } catch (e) {
                localStorage.setItem('iaa_id', tempID);
                anonId = tempID;
                alert("Biometric haijasajiliwa, lakini kodi yako imehifadhiwa!");
                location.reload();
            }
        }

        function verifyWithCode() {
            const code = document.getElementById('passcodeInput').value.trim().toUpperCase();
            if (code === anonId) {
                document.getElementById('lockOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
            } else {
                alert("Kodi sio sahihi!");
            }
        }
    </script>
</body>

</html>
