<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAA 3D Face Secure</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --success: #38ef7d; --accent: #ff4d4d; --bg: #061a3d; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); font-family: 'Poppins', sans-serif; color: white; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }

        /* --- 3D SCANNER OVERLAY --- */
        #scannerUI {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #061a3d; z-index: 99999; display: none;
            flex-direction: column; align-items: center; justify-content: center;
        }

        .face-guide-circle {
            width: 280px; height: 280px; border: 2px dashed rgba(0, 210, 255, 0.5);
            border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center;
        }

        #videoFeed { width: 250px; height: 250px; border-radius: 50%; object-fit: cover; transform: scaleX(-1); border: 4px solid var(--primary); }

        /* Scanning Mesh Animation */
        .mesh-overlay {
            position: absolute; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.2; pointer-events: none; border-radius: 50%;
        }

        .instruction-box {
            margin-top: 30px; text-align: center; padding: 20px;
            background: rgba(255,255,255,0.05); border-radius: 20px; width: 80%;
        }

        .progress-bar { width: 200px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 15px auto; overflow: hidden; }
        #progressFill { width: 0%; height: 100%; background: var(--primary); transition: 0.3s; }

        #emotionIcon { font-size: 80px; display: none; margin-bottom: 20px; }

        .btn { background: linear-gradient(90deg, #9d50bb, #00d2ff); border: none; padding: 18px 40px; border-radius: 20px; color: white; font-weight: bold; font-family: 'Orbitron'; cursor: pointer; margin-top: 20px; width: 100%; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="scannerUI">
        <div id="emotionIcon">😊</div>
        <h2 id="stepTitle" style="font-family: Orbitron; color: var(--primary); margin-bottom: 10px;">SAJILI SURA 3D</h2>
        
        <div class="face-guide-circle">
            <video id="videoFeed" autoplay playsinline></video>
            <div class="mesh-overlay"></div>
        </div>

        <div class="instruction-box">
            <p id="guideText">Weka sura yako katikati ya duara</p>
            <div class="progress-bar"><div id="progressFill"></div></div>
            <p id="percentText" style="font-size: 10px; opacity: 0.5;">0% Complete</p>
        </div>
    </div>

    <div id="lockCard" style="text-align: center; padding: 30px; background: rgba(255,255,255,0.05); border-radius: 40px; border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 400px; backdrop-filter: blur(20px);">
        <img src="logo.jpg" style="width: 80px; border-radius: 50%; border: 2px solid var(--primary); margin-bottom: 20px;">
        <h2 style="font-family: Orbitron; margin-bottom: 25px;">IAA 3D SECURE</h2>
        <button class="btn" onclick="verifyFace3D()">HAKIKI SURA 3D 🔓</button>
        <button class="btn" style="background: none; border: 1px solid var(--primary); margin-top: 15px;" onclick="startRegistration()">MGENI MPYA (3D SIGNUP)</button>
    </div>

    <div id="mainApp" class="hidden" style="text-align: center;">
        <h1 style="color: var(--success); font-family: Orbitron;">IMETHIBITISHWA!</h1>
        <p>Portal ya IAA sasa ipo wazi.</p>
        <button class="btn" onclick="location.reload()" style="background: var(--accent);">LOGOUT</button>
    </div>

    <script>
        let faceData = localStorage.getItem('iaa_3d_face');
        let scanProgress = 0;
        const video = document.getElementById('videoFeed');

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                video.srcObject = stream;
                document.getElementById('scannerUI').style.display = 'flex';
            } catch (e) { alert("Ruhusu kamera!"); }
        }

        // --- MCHAKATO WA KUSAJILI (REGISTRATION) ---
        function startRegistration() {
            initCamera();
            runScanSequence(["Angalia Mbele", "Geukia Kulia Kidogo", "Geukia Kushoto Kidogo", "Inamisha Kichwa Chini", "Tabasamu Kidogo"], true);
        }

        // --- MCHAKATO WA KUHAKIKI (VERIFICATION) ---
        function verifyFace3D() {
            if(!faceData) return alert("Hujasajiliwa! Bonyeza 'Mgeni Mpya'.");
            initCamera();
            runScanSequence(["Inahakiki Sura Yako...", "Inachakata Pointi za 3D..."], false);
        }

        function runScanSequence(steps, isReg) {
            let stepIndex = 0;
            const guide = document.getElementById('guideText');
            const progress = document.getElementById('progressFill');
            const percent = document.getElementById('percentText');

            const interval = setInterval(() => {
                if (stepIndex < steps.length) {
                    guide.innerText = steps[stepIndex];
                    scanProgress += (100 / steps.length);
                    progress.style.width = scanProgress + "%";
                    percent.innerText = Math.round(scanProgress) + "% Complete";
                    stepIndex++;
                } else {
                    clearInterval(interval);
                    completeProcess(isReg);
                }
            }, 2000); // Kila baada ya sekunde 2 inabadilisha angle
        }

        function completeProcess(isReg) {
            const emotion = document.getElementById('emotionIcon');
            const title = document.getElementById('stepTitle');
            const videoContainer = document.querySelector('.face-guide-circle');

            if(isReg) {
                localStorage.setItem('iaa_3d_face', 'registered_3d_data');
                title.innerText = "USAJILI TAYARI!";
            } else {
                title.innerText = "IMETHIBITISHWA!";
            }

            title.style.color = "var(--success)";
            emotion.style.display = "block";
            videoContainer.style.display = "none";
            document.querySelector('.instruction-box').style.display = "none";

            setTimeout(() => {
                document.getElementById('scannerUI').style.display = 'none';
                document.getElementById('lockCard').style.display = 'none';
                document.getElementById('mainApp').classList.remove('hidden');
            }, 2000);
        }
    </script>
</body>
</html>
