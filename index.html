<!DOCTYPE html>
<html lang="sw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAA Gender & Counseling Support System</title>

    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="shortcut icon" href="logo.jpg" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@500&display=swap"
        rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#061a3d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="logo.jpg">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --glass-thick: rgba(255, 255, 255, 0.15);
            --border: rgba(255, 255, 255, 0.2);
            --primary: #00d2ff;
            --secondary: #9d50bb;
            --accent: #ff4d4d;
            --success: #38ef7d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #061a3d 0%, #1e3c72 50%, #061a3d 100%);
            font-family: 'Poppins', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            overflow-x: hidden;
        }

        #lockOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #061a3d, #1e3c72);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(25px);
        }

        .lock-box {
            background: var(--glass);
            border: 1px solid var(--border);
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            width: 95%;
            max-width: 450px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        /* --- ANIMATIONS ZA BIOMETRIC --- */
        .bio-icon-container {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bio-scanner {
            width: 80px;
            height: 80px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            position: absolute;
            animation: pulse 2s infinite;
        }

        .fingerprint-svg {
            width: 60px;
            height: 60px;
            fill: var(--primary);
            opacity: 0.3;
        }

        .scanning-line {
            position: absolute;
            width: 80px;
            height: 2px;
            background: var(--success);
            top: 50%;
            box-shadow: 0 0 15px var(--success);
            animation: scanMove 2s infinite ease-in-out;
            display: none;
        }

        @keyframes scanMove {
            0% {
                top: 20%;
            }

            50% {
                top: 80%;
            }

            100% {
                top: 20%;
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: scale(1.3);
                opacity: 0;
            }
        }

        .id-badge {
            background: var(--primary);
            color: #061a3d;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-family: 'Orbitron';
            margin: 20px 0;
            display: inline-block;
            letter-spacing: 2px;
            box-shadow: 0 0 15px var(--primary);
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--glass);
            backdrop-filter: blur(30px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 20px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            color: var(--primary);
            letter-spacing: 1px;
        }

        .nav-tabs {
            display: flex;
            background: rgba(0, 0, 0, 0.3);
            padding: 5px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .tab {
            flex: 1;
            padding: 12px 5px;
            text-align: center;
            font-size: 9px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 12px;
            transition: 0.3s;
            opacity: 0.6;
        }

        .tab.active {
            background: var(--primary);
            color: #061a3d;
            opacity: 1;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        select,
        textarea,
        input {
            width: 100%;
            padding: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 15px;
            color: white;
            outline: none;
            font-size: 13px;
        }

        .btn {
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 15px;
            color: white;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }

        .chat-container {
            height: 350px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 20px;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 85%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 12px;
        }

        .msg-office {
            align-self: flex-start;
            background: var(--glass-thick);
            color: var(--primary);
        }

        .msg-student {
            align-self: flex-end;
            background: var(--primary);
            color: #061a3d;
        }

        .hidden {
            display: none !important;
        }

        .divider {
            margin: 20px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .divider span {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #152c50;
            padding: 0 10px;
            font-size: 10px;
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div id="lockOverlay">
        <div class="lock-box">
            <div class="bio-icon-container" id="bioContainer">
                <div class="bio-scanner"></div>
                <svg class="fingerprint-svg" viewBox="0 0 24 24">
                    <path
                        d="M17.81 4.47c-.08 0-.16-.02-.23-.06C15.66 3.42 14 3 12.01 3c-1.98 0-3.86.47-5.57 1.41-.24.13-.54.04-.68-.2-.13-.24-.04-.55.2-.68C7.82 2.52 9.86 2 12.01 2c2.13 0 3.99.47 6.03 1.56.24.13.33.43.2.67-.09.15-.24.24-.43.24zM3.51 9.72c-.1 0-.2-.03-.3-.09-.23-.15-.3-.45-.15-.68C4.7 6.4 7.62 4.5 12 4.5c4.35 0 7.31 1.9 8.93 4.44.15.23.08.54-.15.68-.23.15-.54.08-.68-.15-1.44-2.25-4.04-3.96-8.1-3.96-4.04 0-6.66 1.71-8.1 3.96-.09.14-.24.23-.39.23zm.51 4.84c-.2 0-.39-.12-.47-.31-.1-.26.03-.54.29-.64 2.25-.86 4.31-1.3 6.13-1.3 1.83 0 3.88.44 6.13 1.3.26.1.39.38.29.64-.1.26-.38.39-.64.29-2.11-.81-3.99-1.23-5.78-1.23-1.78 0-3.66.42-5.78 1.23-.06.02-.12.02-.17.02zm8.01 6.94c-2.4 0-4.66-.75-6.55-2.15-.22-.17-.27-.48-.1-.7.17-.22.48-.27.7-.1 1.69 1.25 3.7 1.93 5.95 1.93 2.25 0 4.26-.68 5.95-1.93.22-.17.53-.12.7.1.17.22.12.53-.1.7-1.89 1.4-4.15 2.15-6.55 2.15z" />
                </svg>
                <div class="scanning-line" id="scanLine"></div>
            </div>

            <h2 id="statusText" style="font-family: Orbitron; color: var(--primary); font-size: 14px;">USALAMA WA
                BIOMETRIC</h2>
            <p id="subStatus" style="font-size: 10px; margin-bottom: 20px; opacity: 0.8;">IAA Gender & Counseling System
            </p>

            <div id="choiceUI">
                <button class="btn" onclick="startBiometricAuth()">INGIA KWA ALAMA YA KIDOLE / SURA 🔓</button>
                <div class="divider"><span>AU TUMIA KODI</span></div>
                <input type="text" id="returningIDInput" placeholder="ANON-XXXX"
                    style="text-align: center; text-transform: uppercase; font-family: Orbitron; margin-bottom: 10px;">
                <button class="btn" style="margin-top: 0; background: var(--glass-thick);"
                    onclick="verifyReturningID()">INGIA KWA KODI</button>
                <button class="btn" style="background: transparent; border: 1px solid var(--primary); margin-top: 25px;"
                    onclick="generateNewIdentity()">MGENI MPYA (TENGENEZA KODI)</button>
            </div>

            <div id="firstTimeUI" class="hidden">
                <p style="font-size: 11px;">Hili ni jina lako la siri. Lihifadhi!</p>
                <div class="id-badge" id="generatedIDDisplay">...</div>
                <button class="btn" onclick="registerBiometric()">SAJILI BIOMETRIC & INGIA</button>
            </div>
        </div>
    </div>

    <div class="blob"></div>

    <div class="container hidden" id="mainApp">
        <div class="header">
            <img src="logo.jpg" alt="Logo"
                style="width: 50px; height: 50px; border-radius: 50%; background: white; margin-bottom: 8px; border: 1px solid var(--primary);">
            <h1>IAA GENDER & COUNSELING</h1>
        </div>

        <div class="nav-tabs">
            <div class="tab active" onclick="switchView('reportView', this)">RIPOTI</div>
            <div class="tab" onclick="switchView('suggestView', this)">MAONI</div>
            <div class="tab" onclick="switchView('chatView', this)">LIVE CHAT</div>
        </div>

        <div id="reportView" class="content-section active">
            <select id="reportCategory">
                <option value="Unyanyasaji wa Kijinsia">Unyanyasaji wa Kijinsia</option>
                <option value="Rushwa ya Ngono/Fedha">Rushwa ya Ngono / Fedha</option>
                <option value="Uonevu (Bullying)">Uonevu (Bullying)</option>
                <option value="Vinginevyo">Vinginevyo</option>
            </select>
            <textarea id="reportDesc" placeholder="Elezea hapa..." style="height: 150px; margin-top: 15px;"></textarea>
            <button class="btn" onclick="submitReport()">🚀 WASILISHA</button>
        </div>

        <div id="suggestView" class="content-section">
            <select id="suggestTarget">
                <option value="Social Welfare">Social Welfare Office</option>
                <option value="Gender Desk">Gender Desk</option>
            </select>
            <textarea id="suggestContent" placeholder="Andika maoni yako hapa..."
                style="height: 150px; margin-top: 15px;"></textarea>
            <button class="btn" onclick="submitSuggestion()">💡 TUMA</button>
        </div>

        <div id="chatView" class="content-section">
            <div class="chat-container" id="chatDisplay"></div>
            <div style="display:flex; gap:10px; margin-top: 15px;">
                <textarea id="chatMessage" placeholder="Andika..." style="height: 55px;"></textarea>
                <button class="btn" onclick="sendMessage()" style="width:65px; margin:0; font-size: 20px;">✈️</button>
            </div>
        </div>
    </div>

    <script>
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcQavkMpgtVEGMoc1nUMLwfeutkCS13ZiSYOPy5AlRBMPNWSFf3HkzJKRewNaX-xctyw/exec";
        let anonId = localStorage.getItem('iaa_welfare_id');
        let tempID = "";

        // --- CUSTOM BIOMETRIC AUTHENTICATION ---
        async function startBiometricAuth() {
            if (!anonId) return alert("Hujasajiliwa. Chagua 'Mgeni Mpya'.");

            const statusText = document.getElementById('statusText');
            const subStatus = document.getElementById('subStatus');
            const scanLine = document.getElementById('scanLine');

            // Tambua aina ya kifaa
            const isPC = !navigator.userAgent.match(/Android|iPhone/i);
            statusText.innerText = isPC ? "INAHAKIKI SURA / PIN..." : "INAHAKIKI KIDOLE...";
            subStatus.innerText = "Tafadhali kamilisha uthibitisho kwenye kifaa chako";
            scanLine.style.display = "block";

            try {
                // Tunatumia WebAuthn lakini bila Google Passkeys (Simple Platform Auth)
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);

                const authOptions = {
                    publicKey: {
                        challenge: challenge,
                        timeout: 60000,
                        userVerification: "required"
                    }
                };

                const credential = await navigator.credentials.get(authOptions);

                if (credential) {
                    statusText.innerText = "IMETHIBITISHWA! ✅";
                    statusText.style.color = "var(--success)";
                    scanLine.style.display = "none";

                    setTimeout(() => {
                        sessionStorage.setItem('is_auth', 'true');
                        openApp();
                    }, 1000);
                }
            } catch (e) {
                statusText.innerText = "USALAMA WA BIOMETRIC";
                subStatus.innerText = "Uhakiki umeshindwa au umesitishwa.";
                scanLine.style.display = "none";
            }
        }

        async function registerBiometric() {
            const statusText = document.getElementById('statusText');
            statusText.innerText = "INASAJILI BIOMETRIC...";

            try {
                // Hapa tunasajili kifaa kiasili (Platform)
                const challenge = new Uint8Array(32);
                window.crypto.getRandomValues(challenge);

                const createOptions = {
                    publicKey: {
                        challenge: challenge,
                        rp: { name: "IAA System", id: window.location.hostname },
                        user: {
                            id: Uint8Array.from(tempID, c => c.charCodeAt(0)),
                            name: tempID,
                            displayName: tempID
                        },
                        pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                        authenticatorSelection: { authenticatorAttachment: "platform" },
                        timeout: 60000
                    }
                };

                const credential = await navigator.credentials.create(createOptions);

                if (credential) {
                    localStorage.setItem('iaa_welfare_id', tempID);
                    anonId = tempID;
                    sessionStorage.setItem('is_auth', 'true');
                    statusText.innerText = "USAJILI UMEKAMILIKA! ✅";
                    setTimeout(openApp, 1000);
                }
            } catch (e) {
                // Hata ikishindwa, mruhusu aendelee na kodi yake (Fall-back)
                localStorage.setItem('iaa_welfare_id', tempID);
                anonId = tempID;
                sessionStorage.setItem('is_auth', 'true');
                alert("Biometric haijasajiliwa, lakini kodi yako imehifadhiwa!");
                openApp();
            }
        }

        function generateNewIdentity() {
            tempID = 'ANON-' + Math.random().toString(36).substring(2, 6).toUpperCase() + Math.floor(1000 + Math.random() * 9000);
            document.getElementById('choiceUI').classList.add('hidden');
            document.getElementById('firstTimeUI').classList.remove('hidden');
            document.getElementById('generatedIDDisplay').innerText = tempID;
        }

        function verifyReturningID() {
            const input = document.getElementById('returningIDInput').value.trim().toUpperCase();
            if (input === anonId) {
                sessionStorage.setItem('is_auth', 'true');
                openApp();
            } else {
                alert("Kodi si sahihi kwa kifaa hiki!");
            }
        }

        function openApp() {
            document.getElementById('lockOverlay').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            loadMessages();
        }

        window.onload = () => {
            if (sessionStorage.getItem('is_auth') === 'true' && anonId) openApp();
        };

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'hidden') {
                sessionStorage.removeItem('is_auth');
                location.reload();
            }
        });

        // --- APP LOGIC ---
        function switchView(viewId, tabElem) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            tabElem.classList.add('active');
            document.querySelectorAll('.content-section').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if (viewId === 'chatView') loadMessages();
        }

        async function submitReport() {
            const desc = document.getElementById('reportDesc').value;
            if (!desc) return alert("Weka maelezo.");
            try {
                await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'sendReport', anonId, category: document.getElementById('reportCategory').value, desc }) });
                alert("Ripoti imetumwa!");
                document.getElementById('reportDesc').value = "";
            } catch (e) { alert("Hitilafu!"); }
        }

        async function submitSuggestion() {
            const content = document.getElementById('suggestContent').value;
            if (!content) return alert("Weka maoni.");
            try {
                await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'sendSuggestion', target: document.getElementById('suggestTarget').value, content }) });
                alert("Asante!");
                document.getElementById('suggestContent').value = "";
            } catch (e) { alert("Hitilafu!"); }
        }

        async function sendMessage() {
            const msgInput = document.getElementById('chatMessage');
            if (!msgInput.value.trim()) return;
            try {
                await fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: 'sendMessage', anonId, alias: anonId, message: msgInput.value.trim() }) });
                msgInput.value = "";
                loadMessages();
            } catch (e) { console.error(e); }
        }

        async function loadMessages() {
            const display = document.getElementById('chatDisplay');
            try {
                const res = await fetch(`${APPS_SCRIPT_URL}?action=getMessages&anonId=${anonId}`);
                const messages = await res.json();
                if (!messages || messages.length === 0) {
                    display.innerHTML = `<div style="text-align:center; opacity:0.5; font-size:11px; margin-top:100px;">Bado hakuna mazungumzo.</div>`;
                    return;
                }
                display.innerHTML = messages.map(m => `
                    <div class="message ${m.sender === 'Ofisi' ? 'msg-office' : 'msg-student'}">
                        <small style="font-weight:600; display:block; margin-bottom:3px; font-size:10px;">${m.sender === 'Ofisi' ? '🛡️ Ofisi' : 'Mimi'}</small>
                        ${m.message}
                    </div>
                `).join('');
                display.scrollTop = display.scrollHeight;
            } catch (e) { }
        }

        setInterval(() => { if (!document.getElementById('chatView').classList.contains('hidden')) loadMessages(); }, 5000);
    </script>
</body>

</html>
