<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAA Gender Support - Official Biometric</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500&family=Poppins:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --success: #38ef7d;
            --accent: #ff4d4d;
            --bg: #061a3d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); font-family: 'Poppins', sans-serif; color: white; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }

        /* --- FULL SCREEN SCANNER UI --- */
        #biometricScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #0a2342, #061a3d);
            z-index: 99999; display: none; flex-direction: column;
            align-items: center; justify-content: center; text-align: center;
        }

        .scan-box {
            width: 200px; height: 200px; border: 3px solid var(--primary);
            border-radius: 40px; position: relative; overflow: hidden;
            box-shadow: 0 0 50px rgba(0, 210, 255, 0.2);
        }

        .scan-line {
            position: absolute; width: 100%; height: 4px; background: var(--primary);
            box-shadow: 0 0 20px var(--primary); top: 0; animation: scanAnim 2s infinite linear;
        }
        @keyframes scanAnim { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }

        .finger-bg { position: absolute; width: 100%; height: 100%; display: grid; grid-template-columns: repeat(8, 1fr); opacity: 0.1; pointer-events: none; }
        .finger-bg span { font-size: 25px; padding: 5px; }

        #emotion { font-size: 100px; display: none; animation: pop 0.5s ease; }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }

        .btn { background: linear-gradient(90deg, #9d50bb, #00d2ff); border: none; padding: 18px 40px; border-radius: 20px; color: white; font-weight: bold; font-family: 'Orbitron'; cursor: pointer; margin-top: 20px; }
        .lock-card { text-align: center; padding: 30px; background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); border-radius: 40px; border: 1px solid rgba(255,255,255,0.1); width: 90%; max-width: 400px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="biometricScreen">
        <div class="finger-bg" id="particles"></div>
        <div id="emotion">😊</div>
        <h1 id="statusTxt" style="font-family: Orbitron; color: var(--primary); margin-bottom: 20px;">INAHAKIKI...</h1>
        <div class="scan-box" id="box">
            <div class="scan-line" id="line"></div>
            <svg style="width:100px; margin-top:50px; fill:var(--primary); opacity:0.3;" viewBox="0 0 24 24"><path d="M12 1c-4.97 0-9 4.03-9 9 0 .41.34.75.75.75s.75-.34.75-.75c0-4.14 3.36-7.5 7.5-7.5s7.5 3.36 7.5 7.5c0 .41.34.75.75.75s.75-.34.75-.75c0-4.97-4.03-9-9-9z"/></svg>
        </div>
        <p id="msgTxt" style="margin-top:20px; font-weight: bold;">WEKA KIDOLE KWENYE SENSA</p>
    </div>

    <div class="lock-card" id="lockUI">
        <img src="logo.jpg" style="width:80px; border-radius:50%; border:2px solid var(--primary); margin-bottom:20px;">
        <h2 style="font-family: Orbitron; margin-bottom: 20px;">IAA SECURE</h2>
        <div id="loginArea">
            <button class="btn" onclick="signIn()">INGIA KWA KIDOLE 🔓</button>
            <button class="btn" style="background:none; border: 1px solid var(--primary); margin-top:15px;" onclick="showSignUp()">MGENI MPYA (JIUNGE)</button>
        </div>
        <div id="signUpArea" class="hidden">
            <input type="text" id="userName" placeholder="ANDIKA JINA LAKO" style="width:100%; padding:15px; border-radius:15px; border:none; margin-bottom:10px; text-align:center; font-family:Orbitron;">
            <button class="btn" onclick="signUp()">SAJILI GOOGLE KEY & INGIA</button>
        </div>
    </div>

    <div id="mainApp" class="hidden" style="text-align:center;">
        <h1 style="color:var(--success); font-family:Orbitron;">KARIBU KWENYE MFUMO</h1>
        <button class="btn" onclick="location.reload()" style="background:var(--accent);">LOGOUT</button>
    </div>

    <script>
        // Jaza background fingerprints
        const part = document.getElementById('particles');
        for(let i=0; i<48; i++) { part.innerHTML += '<span>⠿</span>'; }

        // 1. SIGN UP - Hapa ndipo tunasajili jina kwenye Google Key
        async function signUp() {
            const name = document.getElementById('userName').value.trim();
            if(!name) return alert("Tafadhali andika jina!");

            const challenge = crypto.getRandomValues(new Uint8Array(32));
            const userID = crypto.getRandomValues(new Uint8Array(16));

            const options = {
                publicKey: {
                    challenge,
                    rp: { name: "IAA Gender System", id: window.location.hostname },
                    user: { id: userID, name: name, displayName: name },
                    pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                    authenticatorSelection: { authenticatorAttachment: "platform", userVerification: "required" },
                    timeout: 60000
                }
            };

            try {
                const credential = await navigator.credentials.create(options);
                if(credential) {
                    localStorage.setItem('iaa_registered', 'true');
                    localStorage.setItem('iaa_user', name);
                    showFullScanner("USAJILI UMEKAMILIKA! 😊");
                }
            } catch (e) {
                alert("Usajili umeshindwa. Hakikisha simu ina alama ya kidole.");
            }
        }

        // 2. SIGN IN - Hapa simu itatambua jina moja kwa moja
        async function signIn() {
            if(localStorage.getItem('iaa_registered') !== 'true') {
                return alert("Hujasajiliwa! Bonyeza 'Mgeni Mpya'.");
            }

            document.getElementById('biometricScreen').style.display = 'flex';
            
            const options = {
                publicKey: {
                    challenge: crypto.getRandomValues(new Uint8Array(32)),
                    authenticatorSelection: { authenticatorAttachment: "platform" },
                    userVerification: "required"
                }
            };

            try {
                const assertion = await navigator.credentials.get(options);
                if(assertion) {
                    showFullScanner("IMETHIBITISHWA! 😊");
                }
            } catch (e) {
                showFullScanner("HAIJATAMBULIKA 😔", false);
            }
        }

        function showFullScanner(msg, success = true) {
            document.getElementById('biometricScreen').style.display = 'flex';
            const status = document.getElementById('statusTxt');
            const emotion = document.getElementById('emotion');
            const box = document.getElementById('box');
            const msgTxt = document.getElementById('msgTxt');

            status.innerText = msg;
            if(success) {
                status.style.color = "var(--success)";
                emotion.innerText = "😊";
                emotion.style.display = "block";
                box.style.display = "none";
                msgTxt.innerText = "Utambulisho ni Sahihi!";
                
                setTimeout(() => {
                    document.getElementById('biometricScreen').style.display = 'none';
                    document.getElementById('lockUI').style.display = 'none';
                    document.getElementById('mainApp').classList.remove('hidden');
                }, 2000);
            } else {
                status.style.color = "var(--accent)";
                emotion.innerText = "😔";
                emotion.style.display = "block";
                box.style.display = "none";
                msgTxt.innerText = "Kidole Sio Sahihi!";
                setTimeout(() => location.reload(), 3000);
            }
        }

        function showSignUp() {
            document.getElementById('loginArea').classList.add('hidden');
            document.getElementById('signUpArea').classList.remove('hidden');
        }
    </script>
</body>
</html>
