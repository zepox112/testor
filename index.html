<!DOCTYPE html>
<html lang="sw">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IAA Gender & Counseling Support System</title>

    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="shortcut icon" href="logo.jpg" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Orbitron:wght@500&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --primary: #00d2ff;
            --secondary: #9d50bb;
            --accent: #ff4d4d;
            --success: #38ef7d;
            --bg: #061a3d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #061a3d 0%, #1e3c72 50%, #061a3d 100%);
            font-family: 'Poppins', sans-serif;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #lockOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, #061a3d, #1e3c72);
            z-index: 10000;
            display: flex;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(25px);
            transition: 0.5s;
        }

        .lock-box {
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 30px;
            border-radius: 30px;
            text-align: center;
            width: 95%;
            max-width: 450px;
        }

        .header-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: white;
            margin-bottom: 15px;
            border: 2px solid var(--primary);
            object-fit: cover;
        }

        /* --- FULL SCREEN SCANNER UI --- */
        #biometricScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #061a3d;
            z-index: 20000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .scanner-frame {
            width: 280px;
            height: 350px;
            border: 2px solid var(--primary);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.3);
        }

        .scanning-line {
            position: absolute;
            width: 100%;
            height: 5px;
            background: var(--primary);
            top: 0;
            box-shadow: 0 0 20px var(--primary);
            animation: moveLine 2s infinite ease-in-out;
        }

        @keyframes moveLine {

            0%,
            100% {
                top: 5%;
            }

            50% {
                top: 90%;
            }
        }

        .fingerprint-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            padding: 20px;
            opacity: 0.2;
        }

        .finger-icon {
            font-size: 30px;
            color: var(--primary);
        }

        #emotionResult {
            font-size: 80px;
            margin-bottom: 20px;
            display: none;
            animation: pop 0.5s ease;
        }

        @keyframes pop {
            0% {
                transform: scale(0);
            }

            100% {
                transform: scale(1);
            }
        }

        .btn {
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            border: none;
            padding: 15px;
            width: 100%;
            border-radius: 15px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
        }

        .id-badge {
            background: var(--primary);
            color: #061a3d;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            margin: 20px 0;
            display: inline-block;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--glass);
            backdrop-filter: blur(30px);
            border-radius: 30px;
            padding: 20px;
            display: none;
        }

        .hidden {
            display: none !important;
        }

        .divider {
            margin: 20px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
        }

        .divider span {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: #152c50;
            padding: 0 10px;
            font-size: 10px;
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div id="lockOverlay">
        <div class="lock-box">
            <img src="logo.jpg" alt="Logo" class="header-logo">
            <h2 style="font-family: Orbitron; color: var(--primary); font-size: 18px;">IAA SECURITY ACCESS</h2>
            <p style="font-size: 10px; margin-bottom: 20px; opacity: 0.8;">Salama • Siri • Uhakika</p>

            <div id="mainAuthUI">
                <button class="btn" onclick="openCustomScanner()">HAKIKI KWA BIOMETRICS 🔓</button>
                <div class="divider"><span>AU TUMIA KODI</span></div>
                <input type="text" id="passcodeInput" placeholder="ANON-XXXX"
                    style="text-align: center; text-transform: uppercase;">
                <button class="btn" style="background: rgba(255,255,255,0.1);" onclick="verifyWithCode()">INGIA KWA
                    KODI</button>
                <button class="btn" style="background:none; border: 1px solid var(--primary); margin-top: 20px;"
                    onclick="startNewUser()">MIMI NI MGENI MPYA</button>
            </div>

            <div id="newUserUI" class="hidden">
                <p style="font-size: 12px;">Hifadhi kodi yako ya siri:</p>
                <div class="id-badge" id="newIDDisplay">...</div>
                <button class="btn" onclick="saveAndEnter()">HIFADHI & INGIA</button>
            </div>
        </div>
    </div>

    <div id="biometricScreen">
        <div id="emotionResult">😊</div>
        <h1 id="scanTitle" style="font-family: Orbitron; color: var(--primary); margin-bottom: 10px;">INAHAKIKI...</h1>
        <p id="scanSub" style="font-size: 12px; margin-bottom: 30px; opacity: 0.7;">Weka uso au kidole kwenye kioo</p>

        <div class="scanner-frame" id="scannerFrame">
            <div class="scanning-line" id="line"></div>
            <div class="fingerprint-grid" id="fingerGrid"></div>
        </div>
        <p id="feedbackText" style="margin-top: 20px; font-weight: 600;"></p>
    </div>

    <div class="container" id="mainApp">
        <div class="header" style="text-align: center; margin-bottom: 20px;">
            <img src="logo.jpg" alt="Logo" style="width: 50px; height: 50px; border-radius: 50%; background: white;">
            <h1 style="font-size: 16px; margin-top: 10px; color: var(--primary);">IAA GENDER SUPPORT</h1>
            <p style="font-size: 10px; opacity: 0.5;">PORTAL IPO WAZI</p>
        </div>
        <button class="btn" onclick="location.reload()">LOGOUT & LOCK</button>
    </div>

    <script>
        let anonId = localStorage.getItem('iaa_id');
        let tempID = "";

        // Tengeneza grid ya fingerprints kwa wingi
        const grid = document.getElementById('fingerGrid');
        for (let i = 0; i < 36; i++) {
            grid.innerHTML += '<span class="finger-icon">⠿</span>';
        }

        function openCustomScanner() {
            if (!anonId) return alert("Hujasajiliwa bado!");

            document.getElementById('biometricScreen').style.display = 'flex';
            const feedback = document.getElementById('feedbackText');
            const frame = document.getElementById('scannerFrame');
            const line = document.getElementById('line');
            const emotion = document.getElementById('emotionResult');
            const title = document.getElementById('scanTitle');

            feedback.innerText = "Inatafuta alama za kibaolojia...";

            // Simulation ya uhakiki (Real custom logic)
            setTimeout(() => {
                feedback.innerText = "Inachakata Sura na Kidole...";
                frame.style.borderColor = "var(--success)";
                line.style.background = "var(--success)";
            }, 2000);

            setTimeout(() => {
                // HAPA NDIPO UNAPOWEZA KUWEKA LOGIC YA KWELI
                // Kwa demo hii, tunadhani imekubali
                title.innerText = "IMETHIBITISHWA!";
                title.style.color = "var(--success)";
                emotion.innerText = "😊";
                emotion.style.display = "block";
                frame.style.display = "none";
                feedback.innerText = "Karibu Zepox, utambulisho ni sahihi.";

                setTimeout(() => {
                    document.getElementById('biometricScreen').style.display = 'none';
                    document.getElementById('lockOverlay').style.display = 'none';
                    document.getElementById('mainApp').style.display = 'block';
                }, 1500);

            }, 4500);
        }

        // Logic ya kukataa (Example function ukihitaji kuita ikifeli)
        function authFailed() {
            const title = document.getElementById('scanTitle');
            const emotion = document.getElementById('emotionResult');
            const feedback = document.getElementById('feedbackText');

            title.innerText = "IMEKATALIWA!";
            title.style.color = "var(--accent)";
            emotion.innerText = "😔";
            emotion.style.display = "block";
            feedback.innerText = "Sura au Kidole sio sahihi. Jaribu tena.";

            setTimeout(() => {
                document.getElementById('biometricScreen').style.display = 'none';
                emotion.style.display = "none";
                document.getElementById('scannerFrame').style.display = "block";
            }, 3000);
        }

        function startNewUser() {
            tempID = 'ANON-' + Math.random().toString(36).substring(2, 6).toUpperCase();
            document.getElementById('mainAuthUI').classList.add('hidden');
            document.getElementById('newUserUI').classList.remove('hidden');
            document.getElementById('newIDDisplay').innerText = tempID;
        }

        function saveAndEnter() {
            localStorage.setItem('iaa_id', tempID);
            anonId = tempID;
            document.getElementById('lockOverlay').style.display = 'none';
            document.getElementById('mainApp').style.display = 'block';
        }

        function verifyWithCode() {
            const code = document.getElementById('passcodeInput').value.trim().toUpperCase();
            if (code === anonId && anonId !== null) {
                document.getElementById('lockOverlay').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
            } else {
                alert("Kodi sio sahihi!");
            }
        }
    </script>
</body>

</html>
